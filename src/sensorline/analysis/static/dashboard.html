<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SensorLine dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 22a8 8 0 0 1 16 0z' fill='%23f59e0b'/%3E%3Cg stroke='%23f59e0b' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 5.5v3'/%3E%3Cpath d='M6.6 9.4l2.1 2.1'/%3E%3Cpath d='M25.4 9.4l-2.1 2.1'/%3E%3Cpath d='M2.5 17.5h3'/%3E%3Cpath d='M26.5 17.5h3'/%3E%3C/g%3E%3Cpath d='M3 25.5h26' stroke='%238a8f98' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* Apply a saved theme before first paint; without one the OS setting decides. */
try { const saved = localStorage.getItem('sensorline-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (error) {}
</script>
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/workspace.css">
</head>
<body data-view="dataset">
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>SensorLine <span>Dashboard</span></h1></div>
  <span class="topbar-spacer"></span>
  <span id="device-chip" class="chip" hidden></span>
  <button id="theme" type="button" class="quiet" aria-label="Switch between light and dark theme">Theme</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <div class="workspace">
    <div id="offline" class="banner error" role="alert" hidden></div>
    <!-- The pages of the Data section: one strip of tabs with the controls that belong to them. -->
    <div class="subbar" data-for="dataset" aria-label="Dataset analysis">
      <div class="tabs" id="data-tabs" role="tablist" aria-label="Dataset analysis pages"></div>
      <div class="subbar-tools">
        <label>Population
          <select id="scope"><option value="train">Train</option><option value="val">Validation</option><option value="all">Train + Validation</option></select>
        </label>
        <button id="run" class="primary">Run analysis</button>
        <button id="refresh" title="Recompute even if the cached result matches the data">Recompute</button>
        <a class="button" href="/analysis.json" id="export" title="All populations, as JSON">Export JSON</a>
      </div>
      <div class="status" data-state="idle"><span class="status-dot" aria-hidden="true"></span><span id="status" role="status">Connecting…</span></div>
    </div>
    <main id="content" tabindex="-1"><p>Analysis is loading.</p></main>
  </div>
</div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="/dashboard.js" defer></script>
<script src="/experiments.js" defer></script>
<script src="/workspace.js" defer></script>
<script src="/inference.js" defer></script>
<script src="/model.js" defer></script>
</body>
</html>
