[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorline"
version = "0.1.0"
description = "Configurable bounding-box detection and counting for the signals of a sensor line"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
optuna = ["optuna>=4,<6"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sensorline*"]

[tool.setuptools.package-data]
"sensorline.analysis" = ["static/*.html", "static/*.js", "static/*.css"]
"sensorline.tracking" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Errors rather than style: syntax, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]
# Scripts and tests set the import path or CUBLAS_WORKSPACE_CONFIG before importing.
ignore = ["E402"]
